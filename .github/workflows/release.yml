name: CI Build APKs

on:
  push:
分支:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: |
          ./gradlew --no-daemon :app:assembleScopedDebug :app:assembleGlobalDebug

      - name: Build release APKs only if signing secrets exist
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE_PATH=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:assembleScopedRelease :app:assembleGlobalRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: location-spoofer-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
